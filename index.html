<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>法國暴動事件解析</title>
<style>
:root{--blue:#2b5cff;--red:#ef3b4a;--gold:#ffc857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;user-select:none}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#070b1c}
.slide{position:absolute;inset:0;visibility:hidden;z-index:0}
.slide svg{width:1080px;height:1920px;display:block}
.slide.leaving{visibility:visible;z-index:2}
.slide.active{visibility:visible;z-index:3;animation-duration:.9s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.65,0,.25,1)}
.slide[data-t=fade].active{animation-name:tfade}
.slide[data-t=left].active{animation-name:tleft}
.slide[data-t=wipe].active{animation-name:twipe}
.slide[data-t=circle].active{animation-name:tcircle}
.slide[data-t=up].active{animation-name:tup}
@keyframes tfade{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:none}}
@keyframes tleft{from{transform:translateX(100%)}to{transform:none}}
@keyframes twipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes tcircle{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
@keyframes tup{from{transform:translateY(100%)}to{transform:none}}
/* cue animations */
.q{opacity:0;transform-box:fill-box;transform-origin:center}
.q.on{animation:var(--an,fu) var(--dur,.8s) cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.gx{transform-origin:left center}.gy{transform-origin:center bottom}
.dr{stroke-dasharray:1}
@keyframes fu{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes fl{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
@keyframes fr{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:none}}
@keyframes gx{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes gy{from{opacity:1;transform:scaleY(0)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@keyframes dr{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes drop{from{opacity:1;transform:none}to{opacity:1;transform:translateY(150px) rotate(5deg)}}
/* ambient */
.hd{opacity:0}.slide.active .hd{animation:fu .8s .15s both}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.86,1.14) skewX(5deg)}}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.65}}
.float{animation:float 7s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-40px)}}
.dash{stroke-dasharray:20 16;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-36}}
.travel{animation:travel 3.6s ease-in-out infinite alternate}
@keyframes travel{from{transform:translateX(0)}to{transform:translateX(780px)}}
.smoke{animation:rise 4.5s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:.55}to{transform:translateY(-320px);opacity:0}}
body.paused .slide *{animation-play-state:paused!important}
/* UI */
#prog{position:absolute;left:54px;right:54px;top:60px;display:flex;gap:8px;z-index:20}
#prog i{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden;cursor:pointer;position:relative}
#prog i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:5px;transition:width .35s}
#prog i.done b{width:100%}
#sub{position:absolute;left:44px;right:44px;top:1440px;height:310px;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none}
#sub span{display:inline-block;max-width:100%;padding:26px 42px;border-radius:40px;background:rgba(6,9,24,.78);border:2px solid rgba(255,255,255,.14);color:#fff;font-size:60px;font-weight:700;line-height:1.38;text-align:center;letter-spacing:2px;animation:fu .45s cubic-bezier(.2,.8,.2,1) both;text-shadow:0 3px 12px rgba(0,0,0,.6)}
#sub span:empty{display:none}
#ctl{position:absolute;left:0;right:0;top:1782px;height:130px;display:flex;align-items:center;justify-content:center;gap:34px;z-index:20}
#ctl button{width:104px;height:104px;border-radius:52px;border:0;background:rgba(255,255,255,.16);padding:28px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
#ctl button svg{width:100%;height:100%;fill:#fff}
#ctl button#spd{width:auto;padding:0 36px;font-size:40px;font-weight:700;font-family:inherit}
#ctl button:active{background:rgba(255,255,255,.3)}
#pg{position:absolute;right:54px;top:92px;color:#9fb0ff;font-size:30px;z-index:20;display:none}
#start{position:absolute;inset:0;z-index:50;background:rgba(5,8,22,.72);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;color:#fff;cursor:pointer}
#start .pb{width:260px;height:260px;border-radius:50%;background:linear-gradient(135deg,#2b5cff,#ef3b4a);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 80px rgba(239,59,74,.5);animation:pulse 2s infinite}
#start .pb svg{width:120px;height:120px;fill:#fff;margin-left:14px}
#start p{margin:0;font-size:72px;font-weight:900}
#start small{font-size:38px;color:#b8c2ee;text-align:center;line-height:1.6}
</style>
</head>

<!-- 6 政府回應 -->

const sub=document.querySelector('#sub');
const bPlay=document.getElementById('bPlay'),bPrev=document.getElementById('bPrev'),bNext=document.getElementById('bNext'),bSpd=document.getElementById('spd');
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

/* ---------- 縮放 ---------- */
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();

/* ---------- 語音（預設女聲，語速中等稍快） ---------- */
const hasTTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
let voice=null,rate=1.15;
function pickVoice(){
  if(!hasTTS)return;
  const vs=speechSynthesis.getVoices();if(!vs.length)return;
  let pool=vs.filter(v=>/^zh[-_](TW|Hant)|^cmn[-_]Hant/i.test(v.lang));
  if(!pool.length)pool=vs.filter(v=>/^zh|^cmn/i.test(v.lang));
  const male=/\bmale\b|danny|zhiwei|yunjhe|yunxi|yunyang|男/i;
  const fem=/mei-?jia|sin-?ji|hsiao|yating|hanhan|ting-?ting|female|女|google.*(國語|中文|cmn)|mei/i;
  voice=pool.find(v=>fem.test(v.name)&&!male.test(v.name))||pool.find(v=>!male.test(v.name))||pool[0]||null;
}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

function speak(text,cb){
  let done=false,tm;
  const fin=()=>{if(done)return;done=true;clearTimeout(tm);cb()};
  const est=Math.max(1000,text.replace(/[，。、：；！？\s]/g,'').length*290/rate+700);
  tm=setTimeout(fin,hasTTS?est+3500:est);
  if(!hasTTS)return;
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-TW';if(voice)u.voice=voice;u.rate=rate;u.pitch=1.05;
    u.onend=fin;u.onerror=fin;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 播放控制 ---------- */
let cur=-1,k=0,gen=0,playing=false,ended=false,started=false;
function setSub(t){sub.innerHTML='';const s=document.createElement('span');s.textContent=t;sub.appendChild(s)}
function count(el){
  const to=+el.dataset.to,suf=el.dataset.suf||'',t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString('en-US')+suf;if(p<1)requestAnimationFrame(f)})(t0);
}
function reveal(j){
  slides[cur].querySelectorAll('[data-q]').forEach(e=>{
    if(+e.dataset.q<=j&&!e.classList.contains('on')){e.classList.add('on');if(e.classList.contains('cnt'))count(e)}
  });
}
function ui(){
  bPlay.innerHTML=(playing?ICON_PAUSE:ICON_PLAY);
  document.body.classList.toggle('paused',!playing&&started);
  segs.forEach((s,i)=>{s.classList.toggle('done',i<cur);const b=s.firstChild;
    if(i===cur){b.style.width=(DATA[cur].c.length?((k+1)/DATA[cur].c.length*100):0)+'%'}else if(i>cur){b.style.width='0'}else b.style.width=''});
}
function runChunk(j){
  const my=gen,d=DATA[cur];
  if(j>=d.c.length){
    k=d.c.length-1;ui();
    setTimeout(()=>{if(my===gen&&playing)show(cur+1)},700);return;
  }
  k=j;setSub(d.c[j]);reveal(j);ui();
  if(!playing)return;
  speak(d.c[j],()=>{if(my===gen&&playing)runChunk(j+1)});
}
function show(i){
  if(i<0)i=0;
  if(i>=N){end();return}
  gen++;if(hasTTS)speechSynthesis.cancel();
  const old=slides[cur],nx=slides[i];
  slides.forEach(s=>{if(s!==old&&s!==nx)s.classList.remove('active','leaving')});
  if(old&&old!==nx){old.classList.remove('active');old.classList.add('leaving');setTimeout(()=>old.classList.remove('leaving'),1000)}
  nx.classList.remove('leaving','active');
  nx.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));
  nx.querySelectorAll('.cnt').forEach(e=>e.textContent='0');
  void nx.offsetWidth;nx.classList.add('active');
  cur=i;k=0;ended=false;setSub('');ui();
  const my=gen;
  setTimeout(()=>{if(my===gen)runChunk(0)},700);
}
function end(){playing=false;ended=true;gen++;setSub('播放完畢，點 ▶ 重新播放');ui()}
function play(){
  if(ended){playing=true;show(0);return}
  playing=true;gen++;runChunk(Math.max(0,k));
}
function pause(){playing=false;gen++;if(hasTTS)speechSynthesis.cancel();ui()}
function toggle(){playing?pause():play()}
function jump(i){if(!started)return;if(!playing){playing=true}show(i)}

bPlay.onclick=e=>{e.stopPropagation();toggle()};
bPrev.onclick=e=>{e.stopPropagation();jump(Math.max(0,cur-1))};
bNext.onclick=e=>{e.stopPropagation();if(cur>=N-1){end()}else jump(cur+1)};
const RATES=[1.0,1.15,1.3];
bSpd.onclick=e=>{e.stopPropagation();rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];bSpd.textContent=rate.toFixed(2).replace(/0$/,'')+'×'};
stage.addEventListener('click',e=>{if(!started||e.target.closest('#ctl,#prog,#start'))return;toggle()});
addEventListener('keydown',e=>{
  if(!started)return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.code==='ArrowRight')jump(Math.min(N-1,cur+1));
  else if(e.code==='ArrowLeft')jump(Math.max(0,cur-1));
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});

/* 封面預覽 */
slides[0].classList.add('active');cur=0;
slides[0].querySelectorAll('[data-q]').forEach(e=>{e.classList.add('on');if(e.classList.contains('cnt'))e.textContent=(+e.dataset.to).toLocaleString('en-US')+(e.dataset.suf||'')});
ui();

document.getElementById('start').onclick=function(){
  this.style.display='none';started=true;playing=true;
  if(hasTTS){pickVoice();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
  show(0);
};
})();
</script>
</body>
</html>
